services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: agentspore-sandbox:latest
    profiles: ["build"]

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentspore-runner:latest
    container_name: agentspore-runner
    ports:
      # 0.0.0.0 binding is intentional — behind Yandex Cloud NAT the host has
      # no local interface for the public IP (89.169.165.39), so binding to it
      # fails. Network isolation is enforced via iptables INPUT rules (see
      # docs/runbook-sandbox-network.md): DROP 172.16/12, 192.168/16, 10.99/16
      # -> dport 8100, so docker bridge containers cannot reach this port.
      - "0.0.0.0:8100:8100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/agents:/data/agents
    environment:
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      # Pinned, NOT ${VAR:-default}: a stale OPENAI_BASE_URL in a deployed .env
      # wins over the default and silently sends every agent to a gateway that
      # answers 403 from Russian hosts (measured 2026-08-26 on this host).
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
      # Measured 2026-08-23 from this host: openrouter.ai, cerebras, groq and
      # hyperbolic all answer 403 (geoblock); llm7 is the only gateway that
      # serves without a key. Only these two of its 47 models were confirmed
      # to emit tool_calls, which an agent cannot work without.
      # Third entry added 2026-08-28 after measuring all 47 llm7 models for
      # tool_calls support: only these three emit them, and an agent without
      # tools is useless. codestral alone was not enough — it answers plain
      # requests but 429s tool-calling ones under load.
      # OpenRouter is 403-geoblocked from this host; the key is live (measured
      # 2026-08-29). This proxy restores it: 6/6 requests, 0 failures, 2.6s avg
      # from this host, tool_calls confirmed on free models.
      # Pinned, NOT ${VAR:-default}: a stale value in a deployed .env wins over
      # the default and silently sends every agent to a dead proxy.
      - LLM_PROXY_URL=http://165.225.66.40:11727
      # Comma-separated, highest priority first. When set it replaces
      # LLM_PROXY_URL entirely: a transport failure advances to the next entry
      # mid-request, so one dead proxy no longer stalls the fleet.
      - LLM_PROXY_CHAIN=${LLM_PROXY_CHAIN:-}
      # Free OpenRouter models with tool_calls, measured live 2026-08-29 through
      # the proxy: minimax-m3 9.2s, nemotron-3.5-lightning 17.2s, north-mini-code 11.3s.
      - LLM_FALLBACK_CHAIN=minimax/minimax-m3:free,cohere/north-mini-code:free,nvidia/nemotron-3.5-lightning:free
      - AGENTSPORE_URL=${AGENTSPORE_URL:-https://agentspore.com}
      - DOCKER_IMAGE=agentspore-sandbox:latest
      - WORKSPACE_ROOT=/data/agents
      - MAX_AGENTS=${MAX_AGENTS:-40}
      - CHAT_TIMEOUT=${CHAT_TIMEOUT:-600}
      - IDLE_TIMEOUT_SECONDS=${IDLE_TIMEOUT_SECONDS:-7200}
      - CONTAINER_MEM_LIMIT=${CONTAINER_MEM_LIMIT:-512m}
      - CONTAINER_PIDS_LIMIT=${CONTAINER_PIDS_LIMIT:-200}
      - SANDBOX_NETWORK_NAME=${SANDBOX_NETWORK_NAME:-sandbox_net}
      - DEFAULT_BUDGET_USD=${DEFAULT_BUDGET_USD:-1.0}
      - RUNNER_KEY=${RUNNER_KEY}
    restart: unless-stopped
    # Bounded json-file logging. An unbounded/rotated default driver left the
    # runner's log file corrupted ("Error decoding log file: invalid character")
    # so `docker logs` returned garbage/empty — debugging chat hangs went blind.
    # Cap size + keep rotation so logs stay readable and never wedge the daemon.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

