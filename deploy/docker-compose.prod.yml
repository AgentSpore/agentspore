# AgentSpore — Production Docker Compose
# Deploy: docker compose -f docker-compose.prod.yml --env-file .env up -d

# Hardening shared by the platform-owned static services (mirrors services/*/compose.yaml).
x-platform-service: &platform-service
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
  mem_limit: 64m
  memswap_limit: 64m
  cpu_period: 100000
  cpu_quota: 25000
  pids_limit: 32
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "1m"
      max-file: "2"

services:
  # Caddy reverse proxy (auto SSL via Let's Encrypt).
  # INVARIANT(deploy): the Caddyfile uses the `rate_limit` directive, which the
  # stock `caddy:2-alpine` image CANNOT parse — it crash-loops on startup with
  # "unrecognized directive: rate_limit" and takes the whole site down. The image
  # MUST be the xcaddy build that bundles caddy-ratelimit (Dockerfile.caddy). Do
  # NOT revert this to a stock caddy image without also removing rate_limit from
  # the Caddyfile. `build` here lets a fresh host produce the image; hosts that
  # already have `agentspore-caddy:ratelimit` reuse it. (Prod outage 2026-07-21:
  # a `git reset --hard` restored a stock-image compose and crash-looped Caddy.)
  caddy:
    image: agentspore-caddy:ratelimit
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: agentspore-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      OTKRYTKA_USAGE_OBSERVER_KEY:
      # DNS-01 token for the *.<domain> wildcard certificates (Zone:DNS:Edit on every domain).
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN, Caddy will not load with an empty or malformed token}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - sporeai-network

  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: agentspore-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: sporeai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sporeai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sporeai-network

  # Flyway migrations
  flyway:
    image: flyway/flyway:10
    container_name: agentspore-flyway
    command: >
      -url=jdbc:postgresql://db:5432/sporeai
      -user=postgres
      -password=${POSTGRES_PASSWORD:-postgres}
      migrate
    volumes:
      - ../db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sporeai-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: agentspore-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sporeai-network

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: agentspore-backend
    restart: always
    environment:
      OTKRYTKA_USAGE_OBSERVER_KEY:
      OTKRYTKA_USAGE_PROJECT_ID:
      DEBUG: "false"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
      SECRET_KEY: "${SECRET_KEY}"
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/sporeai"
      REDIS_URL: "redis://redis:6379"

      LLM_API_KEY: "${OPENROUTER_API_KEY:-}"
      LLM_BASE_URL: "https://openrouter.ai/api/v1"
      LLM_MODEL: "${LLM_MODEL:-moonshotai/kimi-k2.5}"

      GITHUB_ORG: "${GITHUB_ORG:-AgentSpore}"
      GITHUB_PAT: "${GITHUB_PAT:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-}"

      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      # Mirror domains (comma-separated). Host is matched against this list only;
      # DOMAIN stays the single canonical host registered with OAuth providers.
      DOMAINS: "${DOMAINS:-agentspore.com,agentspore.ru}"
      GITHUB_OAUTH_REDIRECT_URI: "https://${DOMAIN:-agentspore.com}/api/v1/agents/github/callback"

      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"

      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-noreply@agentspore.com}"
      FRONTEND_URL: "${FRONTEND_URL:-https://agentspore.com}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-[\"127.0.0.1\",\"172.16.0.0/12\",\"::1\"]}"

      # User OAuth (Google + GitHub for humans)
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      USER_GITHUB_OAUTH_CLIENT_ID: "${USER_GITHUB_OAUTH_CLIENT_ID:-}"
      USER_GITHUB_OAUTH_CLIENT_SECRET: "${USER_GITHUB_OAUTH_CLIENT_SECRET:-}"
      OAUTH_REDIRECT_BASE_URL: "https://${DOMAIN:-agentspore.com}"

      # OpenViking (shared agent memory)
      OPENVIKING_URL: "${OPENVIKING_URL:-}"
      OPENVIKING_API_KEY: "${OPENVIKING_API_KEY:-}"
      AGENT_RUNNER_URL: "${AGENT_RUNNER_URL:-}"
      AGENT_RUNNER_KEY: "${AGENT_RUNNER_KEY:-}"

      CORS_ORIGINS: '["https://${DOMAIN:-agentspore.com}","http://localhost:3000","*"]'

      # LLM provider API keys (agent-runner fallback providers)
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      NEBIUS_API_KEY: "${NEBIUS_API_KEY:-}"
      SAMBANOVA_API_KEY: "${SAMBANOVA_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      ZAI_API_KEY: "${ZAI_API_KEY:-}"
      MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      CLOUDFLARE_API_KEY: "${CLOUDFLARE_API_KEY:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      LLM7_API_KEY: "${LLM7_API_KEY:-}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ../skill.md:/app/skill.md:ro
      # Operator-local, git-ignored (/scripts/ in .gitignore) — absent from a fresh
      # checkout by design. It occupies /app/scripts, which is why backend/Dockerfile
      # ships the operator one-shots as /app/ops_scripts instead. Repointing or
      # removing this mount means revisiting that COPY and the manifest test.
      - ../scripts:/app/scripts:ro
      - backend_logs:/app/logs
    networks:
      - sporeai-network

  # Next.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin: the browser calls whichever domain it was served from.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_GA_ID: "${GA_MEASUREMENT_ID:-}"
    container_name: agentspore-frontend
    restart: always
    environment:
      # Server-side rendering has no browser origin; it reaches the API over the compose network.
      INTERNAL_API_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sporeai-network

  # Platform-owned static services (S1). Reached only through the backend service
  # gateway at http://svc-<revision>:8080; no published ports. The alias is the
  # active_revision literal seeded by db/migrations/V99__platform_services.sql.
  # INVARIANT(A4): do not run the deploy pipeline against these projects; it would
  # overwrite active_revision and orphan the container behind the fixed alias.
  family-safety:
    <<: *platform-service
    image: agentspore-svc-family-safety:latest
    build:
      context: ../services/family-safety
      network: none
    container_name: agentspore-svc-family-safety
    networks:
      sporeai-network:
        aliases:
          - svc-5c97579aaa714f53aa63ce800f93979e

  emergency-binder:
    <<: *platform-service
    image: agentspore-svc-emergency-binder:latest
    build:
      context: ../services/emergency-binder
      network: none
    container_name: agentspore-svc-emergency-binder
    networks:
      sporeai-network:
        aliases:
          - svc-ccb56a65f4844a63a6b14756fe500537

networks:
  sporeai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  backend_logs:
