# Read-only package mirrors for untrusted builds: PyPI :8081, npm :8082, Go :8083, crates.io :8084.
# Builds speak plain HTTP to this container; only it talks to the internet, and only to the fixed
# upstream hosts written below. Per location: GET/HEAD only, the client path must match a strict
# pattern, the upstream host is a literal (no client-chosen host, no CONNECT), and nothing the
# client sent (headers, cookies, body, query string) is forwarded: only $uri is.
resolver 127.0.0.11 valid=60s ipv6=off;
proxy_cache_path /tmp/cache levels=1:2 keys_zone=pkg:10m max_size=1200m min_free=500m inactive=12h use_temp_path=off;
proxy_cache pkg;
proxy_cache_key $server_port$uri;
proxy_cache_valid 200 1h;
proxy_cache_valid 404 1m;
proxy_cache_lock on;
# Cloudflare-fronted registries send Set-Cookie, which stops nginx caching; no client data is sent
# upstream, so the cookie is never per-client.
proxy_ignore_headers Set-Cookie;
proxy_hide_header Set-Cookie;
proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
client_max_body_size 1k;
server_tokens off;

server {
    listen 8081;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    sub_filter_once off;
    sub_filter 'https://files.pythonhosted.org/' 'http://10.213.77.12:8081/files/';
    location ~ "^/simple/(?!.*\.\.)[A-Za-z0-9._-]+/?$" {
        proxy_set_header Accept text/html;
        proxy_redirect https://pypi.org/ http://10.213.77.12:8081/;
        proxy_set_header Host pypi.org;
        proxy_pass https://pypi.org$uri;
    }
    location ~ "^/files/(?!.*\.\.)(packages/[A-Za-z0-9._/+-]+)$" {
        proxy_set_header Host files.pythonhosted.org;
        proxy_pass https://files.pythonhosted.org/$1;
    }
    location / { return 403; }
}

server {
    listen 8082;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    sub_filter_once off;
    sub_filter_types application/json application/vnd.npm.install-v1+json;
    sub_filter 'https://registry.npmjs.org/' 'http://10.213.77.12:8082/';
    location ~ "^/(?!.*\.\.)(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9._~-]+(/-/[A-Za-z0-9._~-]+\.tgz)?$" {
        proxy_set_header Accept "application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*";
        proxy_set_header Host registry.npmjs.org;
        proxy_pass https://registry.npmjs.org$uri;
    }
    location / { return 403; }
}

server {
    listen 8083;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ "^/(?!.*\.\.)[A-Za-z0-9._~!/+-]+/@(v/[A-Za-z0-9._+!-]+\.(info|mod|zip)|v/list|latest)$" {
        proxy_set_header Host proxy.golang.org;
        proxy_pass https://proxy.golang.org$uri;
    }
    # GOSUMDB="sum.golang.org http://10.213.77.12:8083/sumdb": proxy.golang.org does not proxy the checksum database.
    location ~ "^/sumdb/(?!.*\.\.)(latest|lookup/[A-Za-z0-9._/@+=!-]+|tile/[0-9]+/[0-9a-z./]+)$" {
        proxy_set_header Host sum.golang.org;
        proxy_pass https://sum.golang.org/$1;
    }
    location / { return 403; }
}

server {
    listen 8084;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    default_type application/json;
    location = /config.json {
        return 200 '{"dl":"http://10.213.77.12:8084/dl","api":"http://10.213.77.12:8084"}';
    }
    location ~ "^/(?:[12]|3/[a-z0-9_-]|[a-z0-9_-]{2}/[a-z0-9_-]{2})/[a-z0-9_-]+$" {
        proxy_set_header Host index.crates.io;
        proxy_pass https://index.crates.io$uri;
    }
    location ~ "^/dl/(?!.*\.\.)([A-Za-z0-9_-]+)/([A-Za-z0-9.+-]+)/download$" {
        proxy_set_header Host static.crates.io;
        proxy_pass https://static.crates.io/crates/$1/$2/download;
    }
    location / { return 403; }
}
