# Allowlist gate in front of the pull-through registry: the main base-image boundary.
# Only GET/HEAD of manifests and sha256 blobs for the listed official repositories.
server {
    listen 5000;
    server_tokens off;

    location = /v2/ {
        return 200 '{}';
    }

    location ~ "^/v2/library/(python|node|golang|rust|alpine|debian|busybox)/(manifests/[A-Za-z0-9_.:-]+|blobs/sha256:[a-f0-9]{64})$" {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://mirror:5000;
        proxy_set_header Host $http_host;
    }

    location / {
        return 403;
    }
}
