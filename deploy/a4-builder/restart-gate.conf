# Restart gate: the only route from the A4 worker to the Docker socket. Default deny; exactly two
# calls pass, both aimed at the buildkitd container: POST .../restart[?t=N] and GET .../json.
# Any other method, path, query or request body gets 403 (or 413) and never reaches the socket.
server {
    listen 2375;
    server_tokens off;
    client_max_body_size 1;

    location ~ "^/v1\.[0-9]{2}/containers/a4-builder-buildkitd-1/restart$" {
        if ($request_method != POST) { return 403; }
        if ($args !~ "^(t=[0-9]{1,2})?$") { return 403; }
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 120s;
        proxy_pass http://unix:/var/run/docker.sock;
    }

    location ~ "^/v1\.[0-9]{2}/containers/a4-builder-buildkitd-1/json$" {
        if ($request_method != GET) { return 403; }
        if ($args != "") { return 403; }
        proxy_pass http://unix:/var/run/docker.sock;
    }

    location / {
        return 403;
    }
}
