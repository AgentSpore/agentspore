# A4 builder: disposable rootless buildkitd under gVisor (runsc), isolated from the platform.
# Standalone project; the existing stack is untouched. Start/stop: docs/a4-builder-runbook.md
#   docker compose -p a4-builder -f deploy/a4-builder.compose.yml up -d
#
# Topology:
#   buildkitd -- a4-builder (internal) -- mirror-gate, pkg-mirror
#   mirror-gate -- a4-mirror-back (internal) -- mirror
#   mirror, pkg-mirror -- a4-upstream (internet route)
# buildkitd has no route to the internet or to platform networks. Base images come only
# through mirror-gate (repo allowlist); RUN steps reach package registries only through
# pkg-mirror (read-only plain-HTTP mirrors of PyPI, npm, Go, crates.io by IP: RUN has no DNS).

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  buildkitd:
    # moby/buildkit:v0.23.2-rootless
    image: moby/buildkit@sha256:cab936745de5d673465948f1e93ff4d6e372bbe33f218afd3314eba45a6f85a9
    runtime: runsc
    user: "1000:1000"
    # INVARIANT(A4-P3a): rootless RUN shares this container's network namespace, so the listener is
    # reachable from untrusted code, and a RUN can already ptrace the daemon. mTLS therefore only
    # keeps OTHER network peers out; it is no boundary against RUN code, and the server key mounted
    # here (also used by the healthcheck) grants a RUN nothing it does not already have.
    # --oci-worker-no-process-sandbox lets RUN kill or outlive daemon processes: one build per
    # daemon. The worker restarts this container after every build through a4-restart-gate; the
    # state below is a tmpfs, so the restart wipes all of it.
    command:
      - --addr=tcp://0.0.0.0:1234
      - --tlscert=/run/secrets/a4_buildkit_cert
      - --tlskey=/run/secrets/a4_buildkit_key
      - --tlscacert=/run/secrets/a4_buildkit_ca
      - --config=/etc/buildkit/buildkitd.toml
      - --oci-worker-no-process-sandbox
    restart: "no"
    # Every path rootless buildkitd writes is a tmpfs below, so a restart wipes the whole container.
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    # rootless BuildKit needs these two relaxed; gVisor is the boundary, not seccomp/AppArmor.
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 6G, pids: 512 }  # the 4g state tmpfs counts against it
    secrets: [a4_buildkit_cert, a4_buildkit_key, a4_buildkit_ca]
    volumes:
      - ./a4-builder/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    tmpfs:
      # Docker adds noexec,nosuid,nodev to every tmpfs; `exec` is needed so RUN can exec binaries
      # from snapshot rootfs on this mount.
      - /home/user/.local/share/buildkit:uid=1000,gid=1000,mode=0700,size=4g,exec
      # TMPDIR of the rootless image (moby/buildkit v0.23.2 Dockerfile, rootless stage).
      - /home/user/.local/tmp:uid=1000,gid=1000,mode=0700,size=256m,exec
      - /run/user/1000:uid=1000,gid=1000,mode=0700,size=64m
      - /tmp:size=256m
    networks: [a4-builder]
    healthcheck:
      # Read through a4-restart-gate's /json: the worker builds only against a daemon that answers mTLS.
      # The server pair doubles as the client pair (the runbook's server cert has no extendedKeyUsage).
      test:
        - CMD
        - buildctl
        - --addr=tcp://127.0.0.1:1234
        - --tlsservername=buildkitd
        - --tlscacert=/run/secrets/a4_buildkit_ca
        - --tlscert=/run/secrets/a4_buildkit_cert
        - --tlskey=/run/secrets/a4_buildkit_key
        - debug
        - workers
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    # runsc: Docker's embedded DNS (127.0.0.11) refuses queries, so peers are addressed by pinned IP.
    extra_hosts: ["mirror-gate:10.213.77.10", "pkg-mirror:10.213.77.12"]
    depends_on:
      mirror-gate: { condition: service_healthy }
      pkg-mirror: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  a4-restart-gate:
    # nginxinc/nginx-unprivileged:1.27-alpine
    # The only path to the Docker socket: restart and inspect of buildkitd, nothing else
    # (a4-builder/restart-gate.conf). It is NOT on a4-builder: a RUN step shares buildkitd's
    # network namespace and could reach it there. Only a4-worker shares a4-control with it.
    image: nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    <<: *hardened
    # The socket is root:docker 0660; nginx runs as uid 101, so it needs the host's docker gid.
    group_add: ["${A4_DOCKER_GID:?set A4_DOCKER_GID to the host docker group id (getent group docker)}"]
    volumes:
      - ./a4-builder/restart-gate.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: { create_host_path: false }
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/v1.44/containers/a4-builder-buildkitd-1/json"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
    networks: [a4-control]

  mirror-gate:
    # nginxinc/nginx-unprivileged:1.27-alpine
    image: nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    <<: *hardened
    volumes:
      - ./a4-builder/mirror-gate.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    networks:
      a4-builder: { ipv4_address: 10.213.77.10 }
      a4-mirror-back: {}
    depends_on: [mirror]

  mirror:
    # registry:3.0.0, pull-through cache of registry-1.docker.io (proxy.ttl exists only in v3)
    image: registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    <<: *hardened
    user: "1000:1000"
    volumes:
      - ./a4-builder/registry-config.yml:/etc/distribution/config.yml:ro
    tmpfs:
      - /var/lib/registry:uid=1000,gid=1000,mode=0750,size=4g
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 5G }
    networks: [a4-mirror-back, a4-upstream]

  pkg-mirror:
    # nginxinc/nginx-unprivileged:1.27-alpine (same digest as mirror-gate)
    image: nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    <<: *hardened
    volumes:
      - ./a4-builder/pkg-mirror.conf:/etc/nginx/conf.d/default.conf:ro
    # Cache lives in RAM: nginx max_size 1200m, min_free 500m (room for one large in-flight download)
    # inside this 2g tmpfs, which counts against the memory limit.
    tmpfs: ["/tmp:size=2g,mode=1777"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/config.json"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2560M, pids: 128 }
    networks:
      a4-builder: { ipv4_address: 10.213.77.12 }
      a4-upstream: {}

# mTLS material stays outside the repository: generate it per docs/a4-builder-runbook.md.
secrets:
  a4_buildkit_cert:
    file: ${A4_BUILDKIT_CERT_DIR:?set A4_BUILDKIT_CERT_DIR}/server.pem
  a4_buildkit_key:
    file: ${A4_BUILDKIT_CERT_DIR:?set A4_BUILDKIT_CERT_DIR}/server-key.pem
  a4_buildkit_ca:
    file: ${A4_BUILDKIT_CERT_DIR:?set A4_BUILDKIT_CERT_DIR}/ca.pem

networks:
  # Created by the main compose file (a4-worker): start a4-worker once, or run
  # `docker network create --internal a4-control`, before `up`.
  a4-control:
    external: true
    name: a4-control
  a4-builder:
    name: a4-builder
    internal: true
    # 10.213.77.0/24: outside Docker's default pools (172.17-31.0.0/16, 192.168.0.0/16) and any
    # route on the host; the A4 runtime address pool must avoid 10.213.0.0/16.
    # Dynamic addresses come from .128/25 only, so they cannot take the static .10/.12.
    ipam: { config: [{ subnet: 10.213.77.0/24, ip_range: 10.213.77.128/25 }] }
    enable_ipv6: false
    # isolated (Docker 28+, internal networks only): the bridge gets no address, so RUN cannot reach
    # host services listening on 0.0.0.0 through the gateway 10.213.77.1 (docker port-publishing docs).
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  a4-mirror-back:
    internal: true
    enable_ipv6: false
  a4-upstream:
    enable_ipv6: false
