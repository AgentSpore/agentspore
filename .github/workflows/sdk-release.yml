name: SDK release

on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must be a tag and equal the SDK version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          if os.environ["REF_TYPE"] != "tag":
              raise SystemExit("run from a sdk-v* tag, not a branch")
          version = tomllib.load(open("sdk/pyproject.toml", "rb"))["project"]["version"]
          if os.environ["REF_NAME"] != f"sdk-v{version}":
              raise SystemExit(f"tag {os.environ['REF_NAME']} != sdk-v{version}")
          init = open("sdk/agentspore_sdk/__init__.py", encoding="utf-8").read()
          if re.search(r'^__version__ = "([^"]+)"', init, re.M).group(1) != version:
              raise SystemExit("agentspore_sdk.__version__ differs from pyproject version")
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist and wheel
        run: uv build --project sdk --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
