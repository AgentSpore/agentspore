name: Frontend

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

concurrency:
  # A PR supersedes its own earlier runs; a push to main never cancels another
  # commit's run, or merging B would discard the verdict on A.
  group: frontend-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify affected components
        id: scope
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/ci_scope.py
      - name: Unaffected component receipt
        if: steps.scope.outputs.frontend == 'false'
        run: echo 'Verified comparison; this component is unaffected.'
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.frontend == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.scope.outputs.frontend == 'true'
      - run: npx tsc --noEmit
        if: steps.scope.outputs.frontend == 'true'

      - name: eslint (ratchet, new violations only)
        if: steps.scope.outputs.frontend == 'true'
        run: |
          set -o pipefail
          rm -f /tmp/eslint.json   # a stale report must never satisfy the ratchet
          npx eslint -f json -o /tmp/eslint.json || true
          node -e "const r=require('/tmp/eslint.json');const m={__files__:r.length};
          for(const f of r)for(const x of f.messages){const k=x.ruleId||'(parse-error)';m[k]=(m[k]||0)+1}
          console.log(Object.entries(m).sort().map(([k,v])=>v+' '+k).join('\n'))" > /tmp/eslint.txt
          python3 - /tmp/eslint.txt ../.github/ci-baselines/eslint.txt <<'PY'
          import sys
          def rows(p): return (l.split() for l in open(p) if l.strip() and l[0] != "#")
          def load(p): return {r: int(n) for n, r in rows(p)}
          cur, base = load(sys.argv[1]), load(sys.argv[2])
          for k in ("__ran__", "__files__"):
              if cur.pop(k, 0) < base.get(k, 0):
                  sys.exit(f"FAIL: {k} below baseline - the linter never linted, empty output is not a pass")
              base.pop(k, None)
          new = {r: (n, base.get(r, 0)) for r, n in cur.items() if n > base.get(r, 0)}
          for r, (n, b) in sorted(new.items()): print(f"NEW {r}: {n} (baseline {b})")
          sys.exit(1 if new else 0)
          PY

      - run: npm test
        if: steps.scope.outputs.frontend == 'true'
      # Some runners resolve apt to a mirror serving ~130 kB/s; the browsers'
      # 125 MB of system packages then took 15+ minutes and the job timed out.
      # Cached .deb files make apt download only what changed since.
      - name: Restore browser system packages
        id: apt-cache
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-apt-${{ runner.os }}-
      - name: Install browsers for connect focus tests
        if: steps.scope.outputs.frontend == 'true'
        timeout-minutes: 8
        run: |
          debs=~/.cache/playwright-apt
          if compgen -G "$debs/*.deb" >/dev/null; then sudo cp "$debs"/*.deb /var/cache/apt/archives/; fi
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get autoclean -qq
          rm -rf "$debs" && mkdir -p "$debs"
          if compgen -G '/var/cache/apt/archives/*.deb' >/dev/null; then cp /var/cache/apt/archives/*.deb "$debs"/; fi
          echo "System packages kept for cache: $(find "$debs" -name '*.deb' | wc -l)"
      - name: Save browser system packages
        if: steps.scope.outputs.frontend == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      # The isolated gate builds the app before running browser tests; its own
      # limit is 14 minutes, this one only bounds the host-side checks around it.
      - name: Connect focus browser tests
        if: steps.scope.outputs.frontend == 'true'
        timeout-minutes: 16
        run: bash scripts/connect-focus-isolation.sh
