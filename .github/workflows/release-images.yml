name: Release images (native AMD64)

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify affected components
        id: scope
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/ci_scope.py
      - name: Unaffected component receipt
        if: steps.scope.outputs.backend_image == 'false' && steps.scope.outputs.frontend_image == 'false' && steps.scope.outputs.runner_image == 'false' && steps.scope.outputs.caddy_image == 'false'
        run: echo 'Verified comparison; this component is unaffected.'
      - name: Build backend
        if: steps.scope.outputs.backend_image == 'true'
        run: bash scripts/ci/build_release_images.sh backend
      - name: Build frontend with canonical API
        if: steps.scope.outputs.frontend_image == 'true'
        run: bash scripts/ci/build_release_images.sh frontend
      - name: Build agent runner
        if: steps.scope.outputs.runner_image == 'true'
        run: bash scripts/ci/build_release_images.sh agent-runner
      - name: Build custom Caddy
        if: steps.scope.outputs.caddy_image == 'true'
        run: bash scripts/ci/build_release_images.sh caddy
      - name: Upload JSON reports only
        if: ${{ (steps.scope.outputs.backend_image == 'true' || steps.scope.outputs.frontend_image == 'true' || steps.scope.outputs.runner_image == 'true' || steps.scope.outputs.caddy_image == 'true') && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-reports
          path: |
            ${{ runner.temp }}/release-image-reports/backend.json
            ${{ runner.temp }}/release-image-reports/frontend.json
            ${{ runner.temp }}/release-image-reports/agent-runner.json
            ${{ runner.temp }}/release-image-reports/caddy.json
          retention-days: 3
          if-no-files-found: ignore
