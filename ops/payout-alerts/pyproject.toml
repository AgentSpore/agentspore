[project]
name = "payout-alerts"
version = "0.1.0"
description = "Forwards payout alerts from the journal to one Telegram chat (stdlib only at runtime)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
payout-alerts = "payout_alerts.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14", "ty>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payout_alerts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
