[project]
name = "payout-signer"
version = "0.1.0"
description = "Host-side payout signer with hard limits (standalone, no network)"
requires-python = ">=3.12"
dependencies = ["solders==0.27.1"]

[project.scripts]
payout-signer = "payout_signer.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14", "ty>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payout_signer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
