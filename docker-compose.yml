# AgentSpore - Docker Compose
# Run: docker-compose up -d
# With Frontend: docker-compose --profile frontend up -d
# With Agents API: docker-compose --profile agents up -d
# With Scheduler (autonomous agents): docker-compose --profile scheduler up -d
# Full stack: docker-compose --profile frontend --profile agents --profile scheduler up -d

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: agentspore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sporeai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sporeai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sporeai-network

  # Flyway database migrations
  flyway:
    image: flyway/flyway:10
    container_name: agentspore-flyway
    # CREATE INDEX CONCURRENTLY (V108) hangs on Flyway's transactional advisory lock
    command: -url=jdbc:postgresql://db:5432/sporeai -user=postgres -password=postgres migrate -postgresql.transactional.lock=false
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sporeai-network

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: agentspore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sporeai-network

  # FastAPI Backend (main API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentspore-backend
    restart: unless-stopped
    environment:
      # App
      DEBUG: "true"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"

      # Database
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/sporeai"

      # Redis
      REDIS_URL: "redis://redis:6379"

      # OpenRouter LLM
      LLM_API_KEY: "${OPENROUTER_API_KEY:-}"
      LLM_BASE_URL: "https://openrouter.ai/api/v1"
      LLM_MODEL: "${LLM_MODEL:-anthropic/claude-3.5-sonnet}"

      # GitHub (production Git provider)
      GITHUB_ORG: "${GITHUB_ORG:-AgentSpore}"
      GITHUB_PAT: "${GITHUB_PAT:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-}"

      # GitHub OAuth
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      GITHUB_OAUTH_REDIRECT_URI: "${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/agents/github/callback}"

      # OpenViking (shared agent memory)
      OPENVIKING_URL: "${OPENVIKING_URL:-}"
      OPENVIKING_API_KEY: "${OPENVIKING_API_KEY:-}"

      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080","http://localhost:5173","*"]'
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - sporeai-network
    volumes:
      - ./backend/app:/app/app:ro  # Hot-reload in dev
      - ./skill.md:/app/skill.md:ro  # skill.md for agents

  # A4 deployment worker (A4_BUILDER=fake|buildkit, default fake). Same image as backend; no Docker socket.
  # Start with: docker compose --profile a4 up a4-worker (idle unless A4_DEPLOY_ENABLED=true)
  a4-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentspore-a4-worker
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "app.workers.a4"]
    init: true
    stop_grace_period: 30s
    healthcheck:
      disable: true
    environment:
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/sporeai"
      REDIS_URL: "redis://redis:6379"
      A4_DEPLOY_ENABLED: "${A4_DEPLOY_ENABLED:-false}"
      A4_BUILDER: "${A4_BUILDER:-fake}"
      A4_BUILDER_OUT_DIR: /var/lib/a4-out
      A4_BUILDKIT_ADDR: "${A4_BUILDKIT_ADDR:-tcp://buildkitd:1234}"
      A4_PKG_MIRROR_HOST: "${A4_PKG_MIRROR_HOST:-10.213.77.12}"
      A4_RECYCLE_GATE_URL: "${A4_RECYCLE_GATE_URL:-http://a4-restart-gate:2375}"
      A4_REGISTRY_URL: "${A4_REGISTRY_URL:-http://a4-registry:5000}"
      A4_RUNTIME: "${A4_RUNTIME:-off}"
      A4_LAUNCHER_URL: "${A4_LAUNCHER_URL:-http://a4-launcher:8080}"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - sporeai-network
      - a4-control
      - a4-registry-net
    volumes:
      - ./backend/app:/app/app:ro
      - type: bind
        source: ${A4_BUILDKIT_CERT_DIR:-./deploy/a4-builder/client-tls-empty}
        target: /run/a4-builder-tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/a4-out:size=4g
    deploy:
      resources:
        limits:
          memory: 6g  # 4g tmpfs counts against it, plus worker headroom
    profiles:
      - a4

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentspore-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sporeai-network
    profiles:
      - frontend

  # Adminer for DB management
  adminer:
    image: adminer:4
    container_name: agentspore-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - sporeai-network
    profiles:
      - tools

  # RedisInsight for Redis monitoring
  redis-insight:
    image: redis/redisinsight:latest
    container_name: agentspore-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - sporeai-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  sporeai-network:
    driver: bridge
  # Worker <-> a4-restart-gate (deploy/a4-builder.compose.yml) only; no route out, never a4-builder.
  a4-control:
    name: a4-control
    internal: true
  # Worker <-> a4-registry (deploy/a4-registry.compose.yml) only; no route out.
  a4-registry-net:
    name: a4-registry-net
    internal: true
