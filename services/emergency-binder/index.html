<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Family folder</title>
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p data-i18n="intro"></p></header>
  <main>
    <section class="settings" data-i18n-aria="settings">
      <label><span data-i18n="language"></span><select id="language" disabled><option value="en">English</option><option value="ru">Русский</option></select></label>
      <label><span data-i18n="country"></span><select id="country" disabled><option value="US">US</option><option value="GB">GB</option></select></label>
      <label><span data-i18n="mode"></span><select id="mode" disabled><option value="family" data-i18n="family"></option><option value="care" data-i18n="care"></option></select></label>
      <p id="country-note"></p>
    </section>
    <section class="editor" aria-labelledby="section-title">
      <nav id="section-nav" data-i18n-aria="sections"></nav>
      <h2 id="section-title" tabindex="-1"></h2>
      <label id="primary-label" for="section-primary"></label>
      <textarea id="section-primary" rows="4" autocomplete="off" spellcheck="false" aria-describedby="status" disabled></textarea>
      <label id="notes-label" for="section-notes"></label>
      <textarea id="section-notes" rows="4" autocomplete="off" spellcheck="false" aria-describedby="status" disabled></textarea>
      <p class="hint" data-i18n="limitHint"></p>
      <button id="mark-complete" type="button" data-i18n="markComplete" disabled></button>
      <p id="status" role="status" aria-live="polite">Loading / Загрузка…</p>
    </section>
    <section class="actions">
      <h2 data-i18n="outputTitle"></h2><p data-i18n="printPrivacy"></p><p id="mode-summary"></p>
      <button id="print-folder" type="button" data-i18n="printFolder" disabled></button>
      <button id="clear-folder" class="secondary" type="button" data-i18n="clearFolder" disabled></button>
    </section>
    <article id="print-preview" aria-labelledby="preview-title"></article>
    <section class="feedback">
      <h2 data-i18n="requestTitle"></h2><p data-i18n="requestHelp"></p>
      <a id="request-country" target="_blank" rel="noopener noreferrer" data-i18n="requestCountry"></a>
    </section>
    <section id="backup-controls" class="actions" aria-busy="false" hidden>
      <h2 data-i18n="backupTitle"></h2><p id="backup-help" data-i18n="backupHelp"></p>
      <label for="backup-password" data-i18n="passwordLabel"></label>
      <input id="backup-password" type="password" autocomplete="off" aria-describedby="backup-help status" disabled>
      <label for="backup-confirm" data-i18n="confirmLabel"></label>
      <input id="backup-confirm" type="password" autocomplete="off" aria-describedby="backup-help status" disabled>
      <button id="backup-export" type="button" data-i18n="backupExportLabel" disabled></button>
      <label for="backup-file" data-i18n="fileLabel"></label><input id="backup-file" type="file" accept="application/json,.json" disabled>
      <button id="backup-import" type="button" data-i18n="backupImportLabel" disabled></button>
      <button id="restore-confirm" type="button" data-i18n="restoreConfirmLabel" disabled hidden></button>
      <button id="restore-cancel" class="secondary" type="button" data-i18n="restoreCancelLabel" disabled hidden></button>
    </section>
  </main>
  <footer><p data-i18n="privacy"></p><p data-i18n="metrics"></p><p data-i18n="adviceLimit"></p></footer>
  <noscript>JavaScript is needed / Нужен JavaScript. No data is saved / Данные не сохраняются.</noscript>
</body>
</html>
