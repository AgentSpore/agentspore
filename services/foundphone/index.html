<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FoundPhone — A way back to you</title>
  <link rel="stylesheet" href="src/styles.css">
  <script src="vendor/qrcode.js" defer></script>
  <script src="src/app.js" type="module"></script>
</head>
<body>
  <header><a href="./" aria-label="FoundPhone home">FoundPhone<span>↗</span></a><label for="language"><span id="language-label" data-copy="language">Language</span><select id="language" aria-labelledby="language-label"><option value="en">English</option><option value="ru">Русский</option></select></label></header>
  <main>
    <section class="intro"><p class="eyebrow" data-copy="eyebrow"></p><h1 data-copy="title"></h1><p data-copy="intro"></p></section>
    <div class="workspace">
      <section class="editor" aria-labelledby="form-title"><h2 id="form-title" data-copy="step"></h2>
        <label for="model"><span id="model-label" data-copy="model">Phone model</span><select id="model" aria-labelledby="model-label"><option value="iphone-x">iPhone X · 1125 × 2436</option><option value="iphone-xr">iPhone XR · 828 × 1792</option><option value="pixel-8">Pixel 8 · 1080 × 2400</option></select></label>
        <label for="mode"><span id="mode-label" data-copy="wallpaperFor">Wallpaper for</span><select id="mode" aria-labelledby="mode-label"><option value="phone" data-copy="modePhone">My phone</option><option value="child" data-copy="modeChild">A child</option><option value="pet" data-copy="modePet">A pet</option></select></label>
        <label><span data-copy="contact">Contact number</span><input id="contact" type="tel" autocomplete="off" inputmode="tel" placeholder="+1 202 555 0123" aria-describedby="contact-help error"></label><small id="contact-help" data-copy="contactHelp"></small>
        <label><span data-copy="message">Message</span><textarea id="message" rows="3" maxlength="500" dir="auto" placeholder="If you find this phone, please call…" aria-describedby="error"></textarea></label>
        <p id="error" role="status" aria-live="polite"></p><button id="download" type="button" data-copy="download" disabled>Download PNG</button><p class="privacy" data-copy="privacy"></p>
        <details><summary data-copy="install"></summary><p data-copy="ios"></p><a href="https://support.apple.com/en-us/102638" target="_blank" rel="noreferrer">Apple ↗</a><p data-copy="android"></p><a href="https://support.google.com/pixelphone/answer/6111557?hl=en" target="_blank" rel="noreferrer">Google ↗</a></details>
      </section>
      <section class="preview" aria-labelledby="preview-title"><p class="eyebrow" id="preview-title" data-copy="preview"></p><div class="phone"><canvas id="wallpaper" role="img" aria-label="Wallpaper preview"></canvas></div><p data-copy="previewHint"></p></section>
    </div>
  </main><footer data-copy="footer"></footer>
</body>
</html>
