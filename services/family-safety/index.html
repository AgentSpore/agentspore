<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Family Safety</title>
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="app-header"><a class="brand" href="./">Family Safety<span aria-hidden="true"> / </span><span data-i18n="brandNote"></span></a></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <label class="language-label" for="language" data-i18n="language"></label>
      <select id="language" disabled><option value="en">English</option></select>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 id="page-title" data-i18n="title"></h1>
      <p class="lede" data-i18n="intro"></p>
      <p id="load-error" role="alert" hidden>Unable to load this language. Your current page is unchanged.</p>
      <noscript>This page needs JavaScript. If a message asks you to act urgently, pause and call the person using a number you already know.</noscript>
    </section>
    <section class="phrase-settings panel" aria-labelledby="phrase-title">
      <p class="eyebrow" data-i18n="stepOne"></p>
      <h2 id="phrase-title" data-i18n="phraseTitle"></h2>
      <p data-i18n="phraseIntro"></p>
      <label for="family-phrase" data-i18n="phraseLabel"></label>
      <input id="family-phrase" type="text" dir="auto" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="phrase-hint phrase-error">
      <p id="phrase-hint" class="hint" data-i18n="phrasePrivacy"></p>
      <p id="phrase-error" class="error" role="alert" data-i18n="phraseTooLong" hidden></p>
      <label class="check-label"><input id="include-phrase" type="checkbox"><span data-i18n="includePhrase"></span></label>
      <button id="print-card" type="button" data-i18n="printCard" disabled></button>
    </section>
    <section id="printable-card" class="paper-card" aria-labelledby="card-title">
      <p class="eyebrow" data-i18n="cardEyebrow"></p>
      <h2 id="card-title" data-i18n="cardTitle"></h2>
      <ol>
        <li data-i18n="cardPause"></li>
        <li data-i18n="cardCall"></li>
        <li data-i18n="cardAsk"></li>
      </ol>
      <div id="card-phrase-area" hidden><p class="eyebrow" data-i18n="cardPhraseLabel"></p><bdi id="card-phrase"></bdi></div>
      <p class="hint" data-i18n="phraseLimit"></p>
    </section>
    <section class="practice panel" aria-labelledby="practice-title">
      <p class="eyebrow" data-i18n="stepTwo"></p>
      <h2 id="practice-title" data-i18n="practiceTitle"></h2>
      <p data-i18n="practiceIntro"></p>
      <button id="start-training" type="button" data-i18n="startTraining" disabled></button>
      <div id="training" hidden>
        <p id="round-status" class="eyebrow" aria-live="polite" tabindex="-1"></p>
        <blockquote id="round-message"></blockquote>
        <div class="choices">
          <button id="pause-verify" type="button" data-i18n="pauseVerify"></button>
          <button id="ordinary-request" class="secondary" type="button" data-i18n="ordinaryRequest"></button>
        </div>
        <p id="round-feedback" class="feedback" aria-live="polite" hidden></p>
        <button id="next-round" class="secondary" type="button" data-i18n="nextRound" disabled></button>
      </div>
      <div id="training-result" tabindex="-1" hidden><h3 id="result-score"></h3><p data-i18n="resultAdvice"></p></div>
      <button id="restart-training" class="secondary" type="button" data-i18n="restartTraining" hidden></button>
    </section>
    <section class="sharing" aria-labelledby="share-title">
      <p class="eyebrow" data-i18n="stepThree"></p>
      <h2 id="share-title" data-i18n="shareTitle"></h2>
      <p data-i18n="sharePrivacy"></p>
      <nav class="share-links" aria-labelledby="share-title">
        <a id="share-whatsapp" target="_blank" rel="noopener noreferrer" data-i18n="shareWhatsApp"></a>
        <a id="share-telegram" target="_blank" rel="noopener noreferrer" data-i18n="shareTelegram"></a>
      </nav>
    </section>
  </main>
  <footer><p data-i18n="metricsPrivacy"></p><p data-i18n="fictionNote"></p></footer>
</body>
</html>
